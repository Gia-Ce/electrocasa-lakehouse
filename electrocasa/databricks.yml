bundle:
  name: electrocasa

sync:
  paths:
    - "."
    - "../src"

include:
  - variables.yml
  - permissions.yml
  - resources/*.yml
  - resources/**/*.yml

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://adb-7405619671154899.19.azuredatabricks.net/
      root_path: /Workspace/Users/gianella@gersonproutlook.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      env_name: "dev"
      tag_environment: "dev"
      catalogo: "electrocasa"
      path_landing: "/Volumes/electrocasa/bronze/landing"
      path_schema_base: "/Volumes/electrocasa/bronze/landing/schemas"
      development_mode_pipeline: true

  prod:
    mode: production
    workspace:
      host: https://adb-7405619671154899.19.azuredatabricks.net/
      root_path: /Workspace/Users/gianella@gersonproutlook.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      env_name: "prod"
      tag_environment: "prod"
      catalogo: "electrocasa_prod"
      path_landing: "/Volumes/electrocasa_prod/bronze/landing"
      path_schema_base: "/Volumes/electrocasa_prod/bronze/landing/schemas"
      development_mode_pipeline: false

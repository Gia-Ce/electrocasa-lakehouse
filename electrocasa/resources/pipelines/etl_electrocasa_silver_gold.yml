resources:
  pipelines:
    etl_electrocasa_silver_gold:
      name: etl_electrocasa_silver_gold
      catalog: ${var.catalogo}
      schema: ${var.schema_gold}
      serverless: true
      photon: true
      development: ${var.development_mode_pipeline}
      # sync.paths coloca src/ dentro de files/; Python necesita su directorio padre.
      root_path: ${workspace.root_path}/files
      libraries:
        - glob:
            include: ../notebooks/pipelines/gold/**
      tags:
        environment: ${var.tag_environment}
        dominio: electrocasa
        capa: gold
      event_log:
        name: event_log_etl_electrocasa_silver_gold
        catalog: ${var.catalogo}
        schema: ${var.schema_observability}

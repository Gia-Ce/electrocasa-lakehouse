resources:
  pipelines:
    etl_electrocasa_bronze_silver:
      name: etl_electrocasa_bronze_silver
      catalog: ${var.catalogo}
      schema: ${var.schema_silver}
      serverless: true
      photon: true
      development: ${var.development_mode_pipeline}
      # sync.paths coloca src/ dentro de files/; Python necesita su directorio padre.
      root_path: ${workspace.root_path}/files
      libraries:
        - glob:
            include: ../notebooks/pipelines/silver/**
      tags:
        environment: ${var.tag_environment}
        dominio: electrocasa
        capa: silver
      event_log:
        name: event_log_etl_electrocasa_bronze_silver
        catalog: ${var.catalogo}
        schema: ${var.schema_observability}
